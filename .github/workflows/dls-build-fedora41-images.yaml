name: "[DLS] [F41] Build F41 image"
run-name: "[DLS] [F41] Build F41 image (by ${{ github.actor }})"
on:
  workflow_call:
    inputs:
      fedora-version:
        description: Fedora version used for the image build
        required: false
        type: string
        default: "41"
  workflow_dispatch:
    inputs:
      fedora-version:
        description: Fedora version used for the image build
        required: false
        type: choice
        options:
          - "41"
          - "44"
        default: "41"
permissions: {}

env:
  DLS_REL_PATH: "./dlstreamer"

jobs:
  setup:
    name: "Setup F${{ inputs.fedora-version }} build configuration"
    runs-on: dlstreamer
    outputs:
      should_run: ${{ steps.skip-check.outputs.should_run }}
    steps:
      - name: Check out dlstreamer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if should skip CI
        id: skip-check
        uses: ./.github/actions/common/check-skip-ci
        with:
          job_name: "Build F${{ inputs.fedora-version }} images"
          working_directory: "."

  build:
    name: "Build f${{ inputs.fedora-version }} img"
    runs-on: dlstreamer
    needs: setup
    container:
      image: fedora:${{ inputs.fedora-version }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip or execute based on configuration
        if: needs.setup.outputs.should_run == 'false'
        run: |
          echo "## ✅ F${{ inputs.fedora-version }} Build Skipped" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Changes only in excluded files" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Install dependencies
        if: needs.setup.outputs.should_run == 'true'
        run: |
          dnf update -y
          dnf install -y git docker

      - name: Check out dlstreamer repository
        if: needs.setup.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          path: dlstreamer

      - name: Init submodules
        if: needs.setup.outputs.should_run == 'true'
        run: |
          cd dlstreamer
          git submodule update --init thirdparty/spdlog

      - name: Pre-pull BuildKit image
        if: needs.setup.outputs.should_run == 'true'
        uses: ./dlstreamer/.github/actions/common/pull-buildkit-image

      - name: Set up Docker Buildx
        if: needs.setup.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e #4.3.0

      - name: Log in to GitHub Container Registry
        if: needs.setup.outputs.should_run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚢 Build f${{ inputs.fedora-version }} img with cache from GHCR
        if: needs.setup.outputs.should_run == 'true'
        env:
          fedora_version: ${{ inputs.fedora-version }}
          fedora_img: ghcr.io/${{ github.repository }}/f${{ inputs.fedora-version }}-img:${{ github.sha }}
          fedora_img_cached: ghcr.io/${{ github.repository }}/f${{ inputs.fedora-version }}-img:buildcache
        run: |
          docker buildx build \
            --load \
            --target dlstreamer \
            --tag "${fedora_img}" \
            --cache-from=type=registry,ref="${fedora_img_cached}" \
            -f "./dlstreamer/docker/fedora${fedora_version}/fedora${fedora_version}.Dockerfile" \
            ${{ env.DLS_REL_PATH }}

      - name: Clean up
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          fedora_img: ghcr.io/${{ github.repository }}/f${{ inputs.fedora-version }}-img:${{ github.sha }}
        run: |
          rm -rf dlstreamer
          docker rmi ${fedora_img} || true
